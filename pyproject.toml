[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "edgeforge"
version = "0.4.0"
description = "Quantitative research and market microstructure platform"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "EdgeForge Contributors"}]
dependencies = [
  "polars>=1.6",
  "pyarrow>=17",
  "duckdb>=1.5.5",
  "pydantic>=2.9",
  "typer>=0.12",
  "rich>=13.8",
  "numpy>=2.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "hypothesis>=6.112",
  "ruff>=0.6",
  "mypy>=1.11",
  "pre-commit>=4.0",
]
databento = ["databento>=0.47"]
live = ["websockets>=13"]

[project.scripts]
edgeforge = "edgeforge.cli.app:app"

[tool.hatch.build.targets.wheel]
packages = ["src/edgeforge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["edgeforge"]

name: Phase 3 CME Validation

on:
  push:
    branches: ["phase3/cme-validation", "main"]
  pull_request:

permissions:
  contents: read

jobs:
  cme-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python package
        run: |
          python -m pip install -U pip
          pip install -e '.[dev]'

      - name: Verify pinned official raw-sample hashes
        run: |
          echo 'cfd06c71c99c0b3fd33f7ee3285b2bbbba9c4f03cb65d362e60a16f2d78a99e1  data/external/official-samples/databento/dc3-glbx-a-20230716T133000.pcap' | sha256sum -c -
          echo '59cbedb003fdbfa0ee800c31ac936f1c30053389dd4108f0e6d8ac679c242d6b  data/external/official-samples/databento/dc3-glbx-a-20230716T133000.pcap.zst' | sha256sum -c -

      - name: Phase 3 unit and invariant tests
        run: |
          pytest -q \
            tests/unit/test_databento_mbo.py \
            tests/unit/test_cme_validation.py \
            tests/unit/test_cme_pcap_snapshot.py \
            tests/unit/test_inventory.py

      - name: Deterministic replay benchmark smoke test
        run: python scripts/phase3_benchmark_replay.py --events 5000

      - name: Build independent CME MDP3 reference parser
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ libpcap-dev zstd
          git submodule update --init external/github/cme-databento/MDP-Order-Book-Generator
          g++ -std=c++17 \
            -Iexternal/github/cme-databento/MDP-Order-Book-Generator \
            tools/phase3/reference_snapshot_dump.cpp \
            -o /tmp/reference_snapshot_dump \
            -lpcap
          test -x /tmp/reference_snapshot_dump

      - name: Inspect pinned raw PCAP snapshot channel
        run: |
          python scripts/phase3_snapshot_summary.py \
            data/external/official-samples/databento/dc3-glbx-a-20230716T133000.pcap \
            --output /tmp/edgeforge_snapshot_summary.json
          /tmp/reference_snapshot_dump \
            data/external/official-samples/databento/dc3-glbx-a-20230716T133000.pcap \
            > /tmp/reference_snapshot.csv
          python scripts/phase3_compare_snapshot_reference.py \
            /tmp/edgeforge_snapshot_summary.json \
            /tmp/reference_snapshot.csv \
            --report /tmp/phase3_snapshot_differential_report.json

      - name: Validate official public normalized CME MBO sample
        run: |
          python scripts/phase3_validate_public_mbo_sample.py \
            --limit 20000 \
            --output /tmp/phase3_public_mbo_evidence.json

      - name: Upload Phase 3 validation evidence
        uses: actions/upload-artifact@v4
        with:
          name: phase3-cme-validation-evidence
          path: |
            /tmp/edgeforge_snapshot_summary.json
            /tmp/reference_snapshot.csv
            /tmp/phase3_snapshot_differential_report.json
            /tmp/phase3_public_mbo_evidence.json

version: 2
policy:
  zero_cost_first: true
  licensed_raw_market_data_must_not_be_committed: true
  require_manifest_and_sha256: true
  preserve_raw_source_when_license_allows_local_storage: true
  never_treat_l2_as_mbo: true
  require_event_time_provenance: true
  holdout_data_must_remain_sealed: true
  public_repository_does_not_imply_data_redistribution_rights: true

phases:
  phase1_order_event_engine:
    required:
      - lobster-sample
      - nasdaq-itch-sample
      - fi-2010
      - bats-pitch-samples
    additional:
      - sgx-full-order-book-github
      - moex-full-order-book-sample

  phase2_scale_and_l2:
    required:
      - okx-l2
      - binance-public
      - bybit-public
      - hyperliquid-l2
      - coinbase-live-l2
    optional:
      - hyperliquid-level4
      - polymarket-orderbook
      - tardis-crypto
      - kraken-public

  phase3_cme_validation:
    required:
      - cme-mdp-sample
      - cme-datamine
      - dxfeed-samples
    conditional:
      - algoseek-sandbox
      - databento-glbx-mdp3
      - rithmic-cme
      - bmll-l3-futures
      - sierra-historical-depth
      - iqfeed-futures
      - lseg-tick-history
      - massive-futures

  phase4_robustness_and_context:
    required:
      - nq-long-ohlcv
      - cboe-vix
      - fred-macro
      - official-economic-calendars
    optional:
      - first-rate-nq-sample
      - tickdata-futures
      - quantquote-intraday
      - optiver-realized-volatility

research_references:
  - github-cme-mdp
  - github-nautilus-databento
  - github-fx-options-vrp
  - github-deep6
  - github-nq-quant
  - github-ml4t
  - github-databento-python
  - hf-binance-2026

cme_target_instruments:
  - NQ
  - ES
  - YM
  - RTY
  - CL
  - GC
